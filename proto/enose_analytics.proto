syntax = "proto3";

package enose.analytics.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "enose_data.proto";

option go_package = "github.com/gsq7474741/rpi_odor/gen/go/enose/analytics/v1;analyticsv1";

// ============================================================================
// Analytics Service - 质量检测与在线分析
// ============================================================================

service AnalyticsService {
  // 实时质检分析 (双向流)
  rpc AnalyzeSensorData(stream enose.data.SensorFrame) returns (stream AnalysisResponse);
  
  // 获取可视化数据 (PCA/t-SNE/聚类)
  rpc GetVisualization(VisualizationRequest) returns (VisualizationResponse);
  
  // 订阅实时可视化更新
  rpc StreamVisualization(VisualizationRequest) returns (stream VisualizationResponse);
  
  // 获取质检配置
  rpc GetQualityConfig(google.protobuf.Empty) returns (QualityConfig);
  
  // 更新质检配置
  rpc UpdateQualityConfig(QualityConfig) returns (QualityConfig);
  
  // 检查归一化帧状态
  rpc GetNormalizedFramesStatus(NormalizedFramesStatusRequest) returns (NormalizedFramesStatusResponse);
  
  // 生成归一化帧
  rpc GenerateNormalizedFrames(GenerateNormalizedFramesRequest) returns (GenerateNormalizedFramesResponse);
  
  // ========== 基于 sample_id 的新接口 ==========
  
  // 检查样本帧状态（含缓存状态）
  rpc GetSampleFramesStatus(SampleFramesStatusRequest) returns (SampleFramesStatusResponse);
  
  // 批量检查样本帧状态（减少网络往返）
  rpc GetBatchSampleFramesStatus(BatchSampleFramesStatusRequest) returns (BatchSampleFramesStatusResponse);
  
  // 生成样本帧（支持 Redis 缓存）
  rpc GenerateSampleFrames(GenerateSampleFramesRequest) returns (GenerateSampleFramesResponse);
  
  // 批量生成样本帧（减少网络往返）
  rpc GenerateBatchSampleFrames(BatchGenerateSampleFramesRequest) returns (BatchGenerateSampleFramesResponse);
  
  // 获取样本帧数据
  rpc GetSampleFrames(GetSampleFramesRequest) returns (GetSampleFramesResponse);
}

// ============================================================================
// Model Service - 多模型训练与推理
// ============================================================================

service ModelService {
  // (legacy) 训练模型
  rpc TrainModel(TrainModelRequest) returns (stream TrainProgress);
  
  // 启动训练任务（异步，立即返回 job_id）
  rpc StartTraining(StartTrainingRequest) returns (StartTrainingResponse);
  
  // 获取训练任务状态
  rpc GetTrainingJob(GetTrainingJobRequest) returns (TrainingJobInfo);
  
  // 列出训练任务
  rpc ListTrainingJobs(ListTrainingJobsRequest) returns (ListTrainingJobsResponse);
  
  // 取消训练任务
  rpc CancelTraining(CancelTrainingRequest) returns (google.protobuf.Empty);
  
  // 删除训练任务（含关联的进度、评估记录）
  rpc DeleteTrainingJob(DeleteTrainingJobRequest) returns (google.protobuf.Empty);
  
  // 流式获取训练进度
  rpc StreamTrainingProgress(StreamTrainingProgressRequest) returns (stream TrainingProgressUpdate);
  
  // 获取训练进度历史（用于查看已完成任务的训练曲线）
  rpc GetTrainingJobProgress(GetTrainingJobProgressRequest) returns (GetTrainingJobProgressResponse);
  
  // 获取训练评估详情
  rpc GetTrainingEvaluation(GetTrainingEvaluationRequest) returns (GetTrainingEvaluationResponse);
  
  // 列出已训练模型
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  
  // 获取模型详情
  rpc GetModel(GetModelRequest) returns (ModelInfo);
  
  // 加载模型到推理引擎
  rpc LoadModel(LoadModelRequest) returns (google.protobuf.Empty);
  
  // 卸载模型
  rpc UnloadModel(google.protobuf.Empty) returns (google.protobuf.Empty);
  
  // 单次推理
  rpc Predict(PredictRequest) returns (PredictResponse);
  
  // 删除模型
  rpc DeleteModel(DeleteModelRequest) returns (google.protobuf.Empty);
}

// ============================================================================
// Label Service - 样品标注管理
// ============================================================================

service LabelService {
  // 创建标签
  rpc CreateLabel(CreateLabelRequest) returns (SampleLabel);
  
  // 列出标签
  rpc ListLabels(ListLabelsRequest) returns (ListLabelsResponse);
  
  // 更新标签
  rpc UpdateLabel(UpdateLabelRequest) returns (SampleLabel);
  
  // 删除标签
  rpc DeleteLabel(DeleteLabelRequest) returns (google.protobuf.Empty);
  
  // 批量标注
  rpc BatchLabel(BatchLabelRequest) returns (BatchLabelResponse);
}

// ============================================================================
// 质量检测消息
// ============================================================================

message AnalysisResponse {
  google.protobuf.Timestamp ts = 1;
  uint64 sensor_seq = 2;
  
  // 质量标志
  repeated QualityAlert alerts = 3;
  
  // 统计指标
  repeated Metric metrics = 4;
  
  // 模型推理结果 (如果已加载模型)
  optional PredictResult prediction = 5;
}

message QualityAlert {
  QualityFlag flag = 1;
  Severity severity = 2;
  string message = 3;
  int32 channel = 4;  // -1 表示全局
  double value = 5;   // 触发值
  double threshold = 6;  // 阈值
}

enum QualityFlag {
  QF_UNKNOWN = 0;
  QF_BASELINE_UNSTABLE = 1;  // 基线不稳
  QF_SENSOR_SATURATION = 2;  // 传感器饱和
  QF_EXCESS_NOISE = 3;       // 噪声过大
  QF_HUMIDITY_OUT_OF_RANGE = 4;  // 湿度异常
  QF_TEMP_OUT_OF_RANGE = 5;      // 温度异常
  QF_FLOW_SUSPECTED = 6;         // 流量异常
  QF_SENSOR_DRIFT = 7;           // 传感器漂移
  QF_SIGNAL_ANOMALY = 8;         // 信号异常
}

enum Severity {
  SEVERITY_UNKNOWN = 0;
  SEVERITY_INFO = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_ERROR = 3;
  SEVERITY_CRITICAL = 4;
}

message Metric {
  string name = 1;
  double value = 2;
  string unit = 3;
  int32 channel = 4;  // -1 表示全局
}

// 质检配置 (所有阈值可调)
message QualityConfig {
  // 基线稳定性
  double baseline_cv_threshold = 1;        // 基线变异系数阈值 (默认 0.05)
  double baseline_slope_threshold = 2;     // 基线斜率阈值 (默认 0.01)
  int32 baseline_window_size = 3;          // 基线检测窗口大小 (默认 60)
  
  // 传感器范围
  double min_resistance = 4;               // 最小电阻值 (默认 100)
  double max_resistance = 5;               // 最大电阻值 (默认 1000000)
  
  // 噪声检测
  double noise_std_threshold = 6;          // 噪声标准差阈值 (默认 0.1)
  int32 noise_window_size = 7;             // 噪声检测窗口大小 (默认 10)
  
  // 环境参数
  double min_humidity = 8;                 // 最小湿度 (默认 20)
  double max_humidity = 9;                 // 最大湿度 (默认 80)
  double min_temperature = 10;             // 最小温度 (默认 15)
  double max_temperature = 11;             // 最大温度 (默认 40)
  
  // 漂移检测
  double drift_threshold = 12;             // 漂移阈值 (默认 0.1)
  int32 drift_window_size = 13;            // 漂移检测窗口大小 (默认 300)
  
  // 告警控制
  bool enable_notifications = 14;          // 是否启用推送通知
  repeated QualityFlag disabled_flags = 15; // 禁用的告警类型
}

// ============================================================================
// 可视化消息
// ============================================================================

message VisualizationRequest {
  VisualizationType type = 1;
  
  // 数据范围
  optional google.protobuf.Timestamp start_time = 2;
  optional google.protobuf.Timestamp end_time = 3;
  optional string experiment_id = 4;
  
  // PCA/t-SNE 参数
  int32 n_components = 5;  // 降维维度 (默认 2)
  int32 perplexity = 6;    // t-SNE perplexity (默认 30)
  
  // 聚类参数
  int32 n_clusters = 7;    // 聚类数量 (默认 5)
  
  // 采样
  int32 max_points = 8;    // 最大样本数 (默认 1000)
  
  // 样本 ID 列表（逗号分隔，优先于 experiment_id）
  optional string sample_ids = 9;
}

enum VisualizationType {
  VIS_UNKNOWN = 0;
  VIS_PCA = 1;
  VIS_TSNE = 2;
  VIS_CLUSTERING = 3;
  VIS_PCA_CLUSTERING = 4;  // PCA + 聚类
}

message VisualizationResponse {
  google.protobuf.Timestamp ts = 1;
  VisualizationType type = 2;
  
  // 降维后的点
  repeated VisPoint points = 3;
  
  // 聚类中心 (如果有)
  repeated VisPoint centers = 4;
  
  // 解释方差比 (PCA)
  repeated double explained_variance_ratio = 5;
  
  // 元信息
  int32 total_samples = 6;
  int32 n_clusters = 7;
}

message VisPoint {
  string id = 1;           // 样本 ID
  repeated double coords = 2;  // 坐标 (2D 或 3D)
  int32 cluster = 3;       // 聚类标签 (-1 表示未聚类)
  string label = 4;        // 用户标签 (如果有)
  google.protobuf.Timestamp ts = 5;
}

// ============================================================================
// 归一化帧消息
// ============================================================================

message NormalizedFramesStatusRequest {
  int32 run_id = 1;        // 实验 run_id
  string phase_name = 2;   // 阶段名称（可选，为空时检查所有阶段）
}

message NormalizedFramesStatusResponse {
  bool exists = 1;                        // 是否存在归一化帧
  repeated NormalizedFramesMeta meta = 2; // 每种方法的元数据
  int32 total_frames = 3;                 // 总帧数
}

message NormalizedFramesMeta {
  string method = 1;           // linear 或 pchip
  int32 n_samples = 2;         // 采样点数
  repeated int32 original_point_counts = 3;  // 每个传感器的原始点数
  int64 time_range_ms = 4;     // 原始时间跨度
  string phase_name = 5;       // 阶段名称
}

message GenerateNormalizedFramesRequest {
  int32 run_id = 1;                // 实验 run_id
  repeated string phase_names = 2; // 阶段名称列表（可选，为空时处理所有阶段）
  int32 n_samples = 3;             // 采样点数 (默认 100)
  repeated string methods = 4;     // 插值方法列表 (默认 ["linear", "pchip"])
}

message GenerateNormalizedFramesResponse {
  bool success = 1;
  string message = 2;
  map<string, int32> frames_generated = 3;  // 每个阶段+方法生成的帧数
}

// ============================================================================
// 基于 sample_id 的归一化帧消息 (新接口)
// ============================================================================

message SampleFramesStatusRequest {
  int32 sample_id = 1;  // 样本 ID
}

message SampleFramesStatusResponse {
  bool exists = 1;                         // 是否存在归一化帧
  bool cached = 2;                         // 是否在 Redis 缓存中
  repeated SampleFramesMeta variants = 3;  // 不同参数的变体
}

// 批量查询请求
message BatchSampleFramesStatusRequest {
  repeated int32 sample_ids = 1;  // 样本 ID 列表
}

// 批量查询响应
message BatchSampleFramesStatusResponse {
  map<int32, SampleFramesStatusResponse> statuses = 1;  // sample_id -> 状态
}

message SampleFramesMeta {
  string method = 1;                        // linear 或 pchip
  int32 n_samples = 2;                      // 采样点数
  repeated int32 original_point_counts = 3; // 每个传感器的原始点数
  int64 time_range_ms = 4;                  // 原始时间跨度
}

message GenerateSampleFramesRequest {
  int32 sample_id = 1;            // 样本 ID
  int32 n_samples = 2;            // 采样点数 (默认 100)
  repeated string methods = 3;    // 插值方法列表 (默认 ["linear", "pchip"])
  optional bool use_cache = 4;    // 是否使用 Redis 缓存 (默认 true)
}

message GenerateSampleFramesResponse {
  bool success = 1;
  string message = 2;
  map<string, int32> frames_generated = 3;  // 每种方法生成的帧数
  bool from_cache = 4;                      // 是否从缓存获取
}

// 批量生成样本帧请求
message BatchGenerateSampleFramesRequest {
  repeated int32 sample_ids = 1;      // 样本 ID 列表
  int32 n_samples = 2;                // 采样点数 (默认 100)
  repeated string methods = 3;        // 插值方法列表 (默认 ["linear", "pchip"])
  optional bool use_cache = 4;        // 是否使用 Redis 缓存 (默认 true)
}

// 批量生成样本帧响应
message BatchGenerateSampleFramesResponse {
  int32 total_samples = 1;            // 总样本数
  int32 success_count = 2;            // 成功数
  int32 failed_count = 3;             // 失败数
  int32 from_cache_count = 4;         // 从缓存获取的数量
  map<int32, string> errors = 5;      // 失败的样本 ID -> 错误信息
}

message GetSampleFramesRequest {
  int32 sample_id = 1;            // 样本 ID
  string method = 2;              // 插值方法 (默认 "linear")
  int32 n_samples = 3;            // 采样点数 (默认 100)
  optional bool use_cache = 4;    // 是否使用 Redis 缓存 (默认 true)
}

message GetSampleFramesResponse {
  bool success = 1;
  repeated double frames = 2;     // 帧数据 (flatten: n_samples * 8)
  int32 n_samples = 3;            // 采样点数
  int32 n_sensors = 4;            // 传感器数 (固定为 8)
  bool from_cache = 5;            // 是否从缓存获取
}

// ============================================================================
// 模型训练消息
// ============================================================================

message TrainModelRequest {
  string name = 1;              // 模型名称
  string description = 2;       // 模型描述
  
  // 数据选择
  repeated string label_ids = 3;  // 用于训练的标签 ID
  optional string experiment_id = 4;  // 或指定实验 ID
  
  // 模型超参数
  MLPConfig config = 5;
  
  // 训练超参数
  int32 epochs = 6;             // 训练轮数 (默认 100)
  int32 batch_size = 7;         // 批大小 (默认 32)
  double learning_rate = 8;     // 学习率 (默认 0.001)
  double validation_split = 9;  // 验证集比例 (默认 0.2)
}

message MLPConfig {
  repeated int32 hidden_layers = 1;  // 隐藏层大小 (默认 [64, 32])
  string activation = 2;             // 激活函数 (默认 "relu")
  double dropout = 3;                // Dropout 比例 (默认 0.2)
}

message TrainProgress {
  int32 epoch = 1;
  int32 total_epochs = 2;
  double train_loss = 3;
  double val_loss = 4;
  double train_accuracy = 5;
  double val_accuracy = 6;
  TrainStatus status = 7;
  string message = 8;
  
  // 训练完成时返回模型信息
  optional ModelInfo model = 9;
}

enum TrainStatus {
  TRAIN_UNKNOWN = 0;
  TRAIN_STARTED = 1;
  TRAIN_IN_PROGRESS = 2;
  TRAIN_COMPLETED = 3;
  TRAIN_FAILED = 4;
}

message ListModelsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListModelsResponse {
  repeated ModelInfo models = 1;
  int32 total = 2;
}

message GetModelRequest {
  string model_id = 1;
}

message LoadModelRequest {
  string model_id = 1;
}

message DeleteModelRequest {
  string model_id = 1;
}

message ModelInfo {
  string id = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Timestamp created_at = 4;
  
  // 模型配置
  MLPConfig config = 5;
  int32 input_dim = 6;
  int32 output_dim = 7;
  repeated string class_names = 8;
  
  // 训练指标
  double train_accuracy = 9;
  double val_accuracy = 10;
  double train_loss = 11;
  double val_loss = 12;
  
  // 存储
  string minio_path = 13;
  int64 file_size = 14;
  
  // 状态
  bool is_loaded = 15;
  
  // 扩展字段
  string model_type = 20;              // mlp/cnn1d/tcn/transformer/svm/xgboost/kmeans
  string task_type = 21;               // classification/regression/contrastive/clustering
  string framework = 22;               // pytorch/sklearn/xgboost
  double test_accuracy = 23;
  string confusion_matrix_json = 24;
  string extra_metrics_json = 25;
  string training_job_id = 26;
}

// ============================================================================
// 推理消息
// ============================================================================

message PredictRequest {
  // 特征向量 (已提取的特征)
  repeated double features = 1;
  
  // 或原始传感器帧
  optional enose.data.SensorFrame frame = 2;
}

message PredictResponse {
  PredictResult result = 1;
}

message PredictResult {
  string predicted_class = 1;
  int32 predicted_index = 2;
  double confidence = 3;
  repeated ClassProbability probabilities = 4;
}

message ClassProbability {
  string class_name = 1;
  double probability = 2;
}

// ============================================================================
// 标签消息
// ============================================================================

message SampleLabel {
  string id = 1;
  string name = 2;                    // 标签名称 (如 "苹果汁")
  string description = 3;             // 描述
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  
  // 关联的数据范围
  repeated LabeledRange ranges = 6;
  
  // 统计
  int32 sample_count = 7;
}

message LabeledRange {
  string experiment_id = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  string phase = 4;  // 可选: 只标注特定阶段
}

message CreateLabelRequest {
  string name = 1;
  string description = 2;
  repeated LabeledRange ranges = 3;
}

message ListLabelsRequest {
  int32 limit = 1;
  int32 offset = 2;
  optional string experiment_id = 3;  // 过滤特定实验
}

message ListLabelsResponse {
  repeated SampleLabel labels = 1;
  int32 total = 2;
}

message UpdateLabelRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  repeated LabeledRange ranges = 4;  // 追加或替换
  bool replace_ranges = 5;           // true 替换, false 追加
}

message DeleteLabelRequest {
  string id = 1;
}

message BatchLabelRequest {
  string label_id = 1;
  repeated LabeledRange ranges = 2;
}

message BatchLabelResponse {
  int32 added_count = 1;
}

// ============================================================================
// Data Service - 实验数据查询与浏览
// ============================================================================

service DataService {
  // 列出实验
  rpc ListExperiments(ListExperimentsRequest) returns (ListExperimentsResponse);
  
  // 查询传感器数据 (分页)
  rpc QuerySensorData(QuerySensorDataRequest) returns (QuerySensorDataResponse);
  
  // 获取聚合统计
  rpc GetAggregatedStats(AggregatedStatsRequest) returns (AggregatedStatsResponse);
  
  // 获取实验详情
  rpc GetExperimentDetail(GetExperimentDetailRequest) returns (ExperimentDetail);
}

// ============================================================================
// 实验列表
// ============================================================================

message ListExperimentsRequest {
  int32 limit = 1;
  int32 offset = 2;
  optional google.protobuf.Timestamp start_time = 3;
  optional google.protobuf.Timestamp end_time = 4;
  optional string label_id = 5;  // 过滤包含特定标签的实验
}

message ListExperimentsResponse {
  repeated ExperimentSummary experiments = 1;
  int32 total = 2;
}

message ExperimentSummary {
  string experiment_id = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  int32 frame_count = 4;
  repeated string phases = 5;
  repeated string labels = 6;  // 关联的标签名称
  string status = 7;  // running, completed, error
  int32 sample_count = 8;  // 真实样本数量（从 samples 表）
}

// ============================================================================
// 传感器数据查询
// ============================================================================

message QuerySensorDataRequest {
  // 过滤条件
  optional string experiment_id = 1;
  optional string label_id = 2;
  optional string phase = 3;
  optional google.protobuf.Timestamp start_time = 4;
  optional google.protobuf.Timestamp end_time = 5;
  
  // 分页
  int32 limit = 6;
  int32 offset = 7;
  
  // 降采样 (用于大数据量)
  int32 downsample_factor = 8;  // 每 N 条取 1 条
  
  // 选择返回的字段
  repeated string fields = 9;  // 空表示全部
}

message QuerySensorDataResponse {
  repeated SensorDataRow rows = 1;
  int32 total = 2;
  int32 returned = 3;
  
  // 列信息
  repeated ColumnInfo columns = 4;
}

message SensorDataRow {
  google.protobuf.Timestamp ts = 1;
  int64 seq = 2;
  string experiment_id = 3;
  string phase = 4;
  repeated double mox_readings = 5;  // 8 个传感器值
  double temperature = 6;
  double humidity = 7;
  double pressure = 8;
  optional string label = 9;  // 如果有标签
  int32 heater_step = 10;
}

message ColumnInfo {
  string name = 1;
  string type = 2;  // number, string, timestamp
  string unit = 3;
}

// ============================================================================
// 聚合统计
// ============================================================================

message AggregatedStatsRequest {
  // 分组维度
  AggregationDimension dimension = 1;
  
  // 过滤条件
  optional string experiment_id = 2;
  optional string label_id = 3;
  optional google.protobuf.Timestamp start_time = 4;
  optional google.protobuf.Timestamp end_time = 5;
  
  // 时间桶大小 (用于时间维度)
  string time_bucket = 6;  // 1m, 5m, 1h, 1d
  
  // 选择的传感器 (空表示全部)
  repeated int32 sensor_indices = 7;
}

enum AggregationDimension {
  AGG_UNKNOWN = 0;
  AGG_BY_EXPERIMENT = 1;   // 按实验分组
  AGG_BY_LABEL = 2;        // 按标签分组
  AGG_BY_PHASE = 3;        // 按阶段分组
  AGG_BY_TIME = 4;         // 按时间分组
  AGG_BY_HEATER_STEP = 5;  // 按加热器步骤分组
  AGG_BY_SENSOR = 6;       // 按传感器分组
}

message AggregatedStatsResponse {
  repeated AggregatedGroup groups = 1;
  AggregationDimension dimension = 2;
}

message AggregatedGroup {
  string key = 1;  // 分组键
  string label = 2;  // 显示标签
  int32 sample_count = 3;
  
  // 传感器统计 (每个传感器)
  repeated SensorStats sensor_stats = 4;
  
  // 环境统计
  double avg_temperature = 5;
  double avg_humidity = 6;
  
  // 时间范围
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
}

message SensorStats {
  int32 sensor_idx = 1;
  double min = 2;
  double max = 3;
  double mean = 4;
  double std = 5;
  double median = 6;
}

// ============================================================================
// 实验详情
// ============================================================================

message GetExperimentDetailRequest {
  string experiment_id = 1;
}

message ExperimentDetail {
  string experiment_id = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  int32 frame_count = 4;
  string status = 5;
  
  // 阶段信息
  repeated PhaseInfo phases = 6;
  
  // 关联标签
  repeated SampleLabel labels = 7;
  
  // 统计摘要
  repeated SensorStats sensor_summary = 8;
  double avg_temperature = 9;
  double avg_humidity = 10;
  
  // 质检结果摘要
  int32 total_alerts = 11;
  int32 critical_alerts = 12;
  int32 warning_alerts = 13;
}

message PhaseInfo {
  string name = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  int32 frame_count = 4;
}

// ============================================================================
// Sample Service - 样本分割与聚合查询
// ============================================================================

service SampleService {
  // 列出样本
  rpc ListSamples(ListSamplesRequest) returns (ListSamplesResponse);
  
  // 获取样本详情
  rpc GetSample(GetSampleRequest) returns (Sample);
  
  // 按参数哈希聚合样本（跨 run 聚合）
  rpc GetSampleGroups(GetSampleGroupsRequest) returns (GetSampleGroupsResponse);
  
  // 获取样本的传感器数据
  rpc GetSampleSensorData(GetSampleSensorDataRequest) returns (GetSampleSensorDataResponse);
  
  // 获取可用的 Phase 列表（从 sample_phase_transitions 表动态获取）
  rpc GetAvailablePhases(GetAvailablePhasesRequest) returns (GetAvailablePhasesResponse);
  
  // 获取样本的 Phase 转换记录
  rpc GetPhaseTransitions(GetPhaseTransitionsRequest) returns (GetPhaseTransitionsResponse);
}

// ============================================================================
// 样本消息
// ============================================================================

message Sample {
  int32 id = 1;
  int32 run_id = 2;
  int32 sample_idx = 3;
  
  // 时间范围
  int64 start_time_ms = 4;
  int64 end_time_ms = 5;
  
  // 参数哈希
  string params_hash = 6;
  
  // 液体参数
  repeated LiquidComponent liquids = 7;
  double total_volume_ml = 8;
  double flow_rate_ml_s = 9;
  
  // 采集参数
  int32 gas_pump_pwm = 10;
  string termination_type = 11;
  double termination_value = 12;
  double max_duration_s = 13;
  
  // 加热器配置
  repeated HeaterConfigInfo heater_configs = 14;
  
  // 清洗参数
  int32 pre_wash_count = 15;
  double pre_wash_volume_ml = 16;
  string wash_liquid_id = 17;
  
  // 阶段
  string phase_name = 18;
  
  // 环境参数
  double avg_temperature_c = 19;
  double avg_humidity_pct = 20;
  double avg_pressure_hpa = 21;
  
  // 元数据
  google.protobuf.Timestamp created_at = 22;
  
  // Phase 转换记录（一个样本可包含多个 phase 时间段）
  repeated PhaseTransition phase_transitions = 23;
  
  // 传感器读数计数（0 表示无数据）
  int32 reading_count = 24;
  
  // ========== 组合实验元数据 (0016-combinatorial-metadata) ==========
  
  // 试剂批次追踪
  string reagent_batch_id = 30;               // 试剂批次号
  string reagent_prep_date = 31;              // 试剂配制日期 (YYYY-MM-DD)
  
  // 序列上下文
  int32 prev_sample_id = 32;                  // 前一个样品 ID（残留评估）
  int32 samples_since_wash = 33;              // 距上次深度清洗的样品数
  
  // 传感器状态
  float sensor_hours_at_sample = 34;          // 采样时传感器累计使用小时
  
  // 漂移校准与空白标记
  bool is_anchor = 35;                        // 漂移校准锚点样品
  bool is_blank = 36;                         // 空白对照
  
  // 实验设计阶段
  string experiment_phase = 37;               // 实验设计阶段标识（Phase 1-6）
  
  // 随机化信息
  string sequence_block = 38;                 // 随机化区组标识
  int32 randomization_seed = 39;              // 随机化种子
  
  // 清洗残余响应
  repeated float wash_residual_response = 40; // 清洗后残余传感器响应（8通道）
  
  // 质量信息（已有 DB 字段，Proto 新增）
  float quality_score = 41;                   // 0-100 综合质量评分
  string quality_level = 42;                  // good/warning/poor
}

message LiquidComponent {
  string id = 1;
  string name = 2;
  double ratio = 3;
  int32 pump_index = 4;
}

message HeaterConfigInfo {
  repeated int32 sensor_indices = 1;
  string profile_name = 2;
  repeated int32 temps = 3;
  repeated int32 durs = 4;
}

message ListSamplesRequest {
  optional int32 run_id = 1;          // 按 run 过滤
  optional string phase_name = 2;     // 按阶段过滤
  optional string params_hash = 3;    // 按参数哈希过滤
  repeated string liquid_ids = 4;     // 按液体过滤
  int32 limit = 5;
  int32 offset = 6;
}

message ListSamplesResponse {
  repeated Sample samples = 1;
  int32 total = 2;
}

message GetSampleRequest {
  int32 sample_id = 1;
}

message GetSampleGroupsRequest {
  optional string phase_name = 1;     // 按阶段过滤
  repeated string liquid_ids = 2;     // 按液体过滤
  int32 limit = 3;
  int32 offset = 4;
}

message GetSampleGroupsResponse {
  repeated SampleGroup groups = 1;
  int32 total = 2;
}

message SampleGroup {
  string params_hash = 1;
  
  // 共同参数
  repeated LiquidComponent liquids = 2;
  int32 gas_pump_pwm = 3;
  string phase_name = 4;
  
  // 聚合统计
  int32 sample_count = 5;
  repeated int32 run_ids = 6;
  google.protobuf.Timestamp first_created = 7;
  google.protobuf.Timestamp last_created = 8;
}

// Phase 转换记录
message PhaseTransition {
  int32 id = 1;
  int32 sample_id = 2;
  string phase_name = 3;
  int64 start_time_ms = 4;
  int64 end_time_ms = 5;    // 0 = 进行中
  int32 phase_order = 6;
}

message GetAvailablePhasesRequest {
  optional int32 run_id = 1;  // 可选，按 run 过滤
}

message GetAvailablePhasesResponse {
  repeated string phase_names = 1;
}

message GetPhaseTransitionsRequest {
  int32 sample_id = 1;
}

message GetPhaseTransitionsResponse {
  repeated PhaseTransition transitions = 1;
}

message GetSampleSensorDataRequest {
  int32 sample_id = 1;
  repeated int32 sensor_indices = 2;  // 空表示全部
  int32 downsample_factor = 3;        // 降采样因子
}

message GetSampleSensorDataResponse {
  int32 sample_id = 1;
  repeated SensorDataRow rows = 2;
  int32 total_points = 3;
}

// ============================================================================
// ML Label Service - ML 标签策略与自动标注
// ============================================================================

service MLLabelService {
  // 列出标签策略配置
  rpc ListMLLabelConfigs(ListMLLabelConfigsRequest) returns (ListMLLabelConfigsResponse);

  // 获取策略详情
  rpc GetMLLabelConfig(GetMLLabelConfigRequest) returns (MLLabelConfig);

  // 创建策略
  rpc CreateMLLabelConfig(CreateMLLabelConfigRequest) returns (MLLabelConfig);

  // 更新策略
  rpc UpdateMLLabelConfig(UpdateMLLabelConfigRequest) returns (MLLabelConfig);

  // 删除策略
  rpc DeleteMLLabelConfig(DeleteMLLabelConfigRequest) returns (google.protobuf.Empty);

  // 为指定策略生成标签（自动从 samples 参数派生）
  rpc GenerateLabels(GenerateLabelsRequest) returns (GenerateLabelsResponse);

  // 获取标签分布
  rpc GetLabelDistribution(GetLabelDistributionRequest) returns (GetLabelDistributionResponse);

  // 获取样本的 ML 标签
  rpc GetSampleMLLabels(GetSampleMLLabelsRequest) returns (GetSampleMLLabelsResponse);

  // 获取训练数据集预览
  rpc PreviewDataset(PreviewDatasetRequest) returns (PreviewDatasetResponse);
}

// ============================================================================
// ML 标签策略消息
// ============================================================================

message MLLabelConfig {
  int32 id = 1;
  string name = 2;
  string label_type = 3;      // classification, regression, contrastive
  string strategy = 4;        // auto_from_params, manual, derived
  string config_json = 5;     // JSON 配置
  string description = 6;
  bool is_active = 7;
  int32 label_count = 8;      // 已生成的标签数
}

message ListMLLabelConfigsRequest {
  bool active_only = 1;
}

message ListMLLabelConfigsResponse {
  repeated MLLabelConfig configs = 1;
}

message GetMLLabelConfigRequest {
  string name = 1;
}

message CreateMLLabelConfigRequest {
  string name = 1;
  string label_type = 2;
  string strategy = 3;
  string config_json = 4;
  string description = 5;
}

message UpdateMLLabelConfigRequest {
  int32 id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string config_json = 4;
  optional bool is_active = 5;
}

message DeleteMLLabelConfigRequest {
  int32 id = 1;
}

message GenerateLabelsRequest {
  string config_name = 1;           // 策略名称（空=所有活跃策略）
  repeated int32 run_ids = 2;       // 按 run 筛选（空=所有）
  repeated string phase_names = 3;  // 按阶段筛选（空=所有）
  repeated int32 sample_ids = 4;    // 按样本 ID 精确筛选（空=不限）
}

message GenerateLabelsResponse {
  map<string, int32> generated_counts = 1;  // config_name -> count
  string message = 2;
}

message GetLabelDistributionRequest {
  string config_name = 1;
  repeated int32 run_ids = 2;
  repeated string phase_names = 3;
  repeated int32 sample_ids = 4;    // 按样本 ID 精确筛选（空=不限）
}

message GetLabelDistributionResponse {
  string config_name = 1;
  string label_type = 2;
  repeated LabelBucket buckets = 3;
  int32 total_samples = 4;
}

message LabelBucket {
  string label = 1;
  int32 count = 2;
  int32 label_index = 3;
}

message GetSampleMLLabelsRequest {
  int32 sample_id = 1;
}

message GetSampleMLLabelsResponse {
  repeated SampleMLLabel labels = 1;
}

message SampleMLLabel {
  string config_name = 1;
  string label_type = 2;
  string label_str = 3;
  double label_num = 4;
  int32 label_index = 5;
}

message PreviewDatasetRequest {
  string config_name = 1;
  repeated int32 run_ids = 2;
  repeated string phase_names = 3;
  double train_ratio = 4;     // 默认 0.7
  double val_ratio = 5;       // 默认 0.15
  double test_ratio = 6;      // 默认 0.15
  repeated int32 sample_ids = 7;    // 按样本 ID 精确筛选（空=不限）
}

message PreviewDatasetResponse {
  string config_name = 1;
  string label_type = 2;
  int32 total_samples = 3;
  int32 train_count = 4;
  int32 val_count = 5;
  int32 test_count = 6;
  repeated LabelBucket label_distribution = 7;
}

// ============================================================================
// Export Service - 数据导出
// ============================================================================

service ExportService {
  // 导出数据（流式返回 ZIP 文件）
  rpc ExportData(ExportDataRequest) returns (stream ExportDataChunk);
}

message ExportDataRequest {
  repeated int32 sample_ids = 1;

  // 类型开关
  bool include_params = 2;
  bool include_raw_data = 3;
  bool include_frames = 4;
  bool include_ml_labels = 5;
  bool include_dataset = 6;

  // 帧配置（归一化帧 + 训练数据集共用）
  string frame_method = 10;            // "linear" / "pchip"
  int32 frame_n_samples = 11;          // 50-500
  string frame_format = 12;            // "npz" / "csv"

  // ML 标签配置
  repeated string ml_label_configs = 15;  // 标签策略名列表

  // 训练数据集配置
  string dataset_label_config = 20;    // 标签策略名
  bool dataset_split = 21;             // 是否分割 train/val/test
  double dataset_train_ratio = 22;     // 默认 0.7
  double dataset_val_ratio = 23;       // 默认 0.15
  string dataset_format = 24;          // "npz" / "csv"
}

message ExportDataChunk {
  bytes data = 1;
  string filename = 2;                 // 当前处理的文件名（用于前端进度显示）
  int32 progress_percent = 3;          // 0-100
}

// ============================================================================
// 训练平台消息
// ============================================================================

message StartTrainingRequest {
  string name = 1;
  string description = 2;
  string model_type = 3;               // "mlp", "cnn1d", "tcn", "transformer", "svm", "xgboost", "kmeans"
  string task_type = 4;                // "classification", "regression", "contrastive", "clustering"

  // 数据集配置
  string label_config_name = 5;        // ML 标签策略名
  repeated int32 sample_ids = 6;
  repeated int32 run_ids = 7;
  double train_ratio = 8;
  double val_ratio = 9;
  int32 frame_n_samples = 10;          // 归一化帧采样点数
  string frame_method = 11;            // "linear" / "pchip"
  int32 seed = 12;

  // 超参数 (JSON 字符串，模型类型不同参数不同)
  string hyperparams_json = 20;
}

message StartTrainingResponse {
  string job_id = 1;
  string message = 2;
}

message GetTrainingJobRequest {
  string job_id = 1;
}

message ListTrainingJobsRequest {
  int32 limit = 1;
  int32 offset = 2;
  string status_filter = 3;            // 可选: PENDING/RUNNING/COMPLETED/FAILED/CANCELLED
}

message ListTrainingJobsResponse {
  repeated TrainingJobInfo jobs = 1;
  int32 total = 2;
}

message CancelTrainingRequest {
  string job_id = 1;
}

message DeleteTrainingJobRequest {
  string job_id = 1;
}

message StreamTrainingProgressRequest {
  string job_id = 1;
}

message TrainingProgressUpdate {
  int32 epoch = 1;
  int32 total_epochs = 2;
  double train_loss = 3;
  double val_loss = 4;
  double train_accuracy = 5;
  double val_accuracy = 6;
  string extra_metrics_json = 7;
}

message GetTrainingJobProgressRequest {
  string job_id = 1;
}

message GetTrainingJobProgressResponse {
  repeated TrainingProgressUpdate entries = 1;
}

message GetTrainingEvaluationRequest {
  string job_id = 1;
}

message GetTrainingEvaluationResponse {
  repeated TrainingEvaluation evaluations = 1;
}

message TrainingJobInfo {
  string id = 1;
  string model_name = 2;
  string model_type = 3;
  string task_type = 4;
  string status = 5;                   // PENDING/RUNNING/COMPLETED/FAILED/CANCELLED
  int32 current_epoch = 6;
  int32 total_epochs = 7;
  double train_loss = 8;
  double val_loss = 9;
  double train_accuracy = 10;
  double val_accuracy = 11;
  double test_accuracy = 12;
  string hyperparams_json = 13;
  string dataset_config_json = 14;
  string error_message = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp started_at = 17;
  google.protobuf.Timestamp completed_at = 18;
  string model_id = 19;               // 训练完成后关联的 ml_models.id
  string extra_metrics_json = 20;
}

message TrainingEvaluation {
  string id = 1;
  string job_id = 2;
  string model_id = 3;
  string split = 4;                    // train/val/test
  double accuracy = 5;
  double loss = 6;
  double f1_macro = 7;
  double f1_weighted = 8;
  double precision_macro = 9;
  double recall_macro = 10;
  double r2_score = 11;
  double mse = 12;
  double mae = 13;
  double silhouette_score = 14;
  string confusion_matrix_json = 15;
  string classification_report_json = 16;
}

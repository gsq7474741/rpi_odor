# Buf 代码生成配置
# 运行: buf generate

version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/your-org/enose/gen/go
plugins:
  # C++ Protobuf 代码生成 (使用本地 protoc, 与 Docker 中 v33.4 兼容)
  - plugin: cpp
    out: ../gen/cpp
  
  # C++ gRPC 代码生成 (使用本地 grpc_cpp_plugin)
  - plugin: grpc_cpp
    out: ../gen/cpp
    path: /usr/bin/grpc_cpp_plugin
  
  # Python Protobuf 代码生成
  - plugin: python
    out: ../gen/python
  
  # Python gRPC 代码生成
  - plugin: grpc_python
    out: ../gen/python
    path: /usr/bin/grpc_python_plugin
  
  # TypeScript 代码生成 (使用 protobuf-ts, 支持 gRPC)
  - plugin: buf.build/community/timostamm-protobuf-ts
    out: ../gen/typescript
    opt:
      - long_type_string
      - generate_dependencies
      - client_grpc1
      - server_grpc1

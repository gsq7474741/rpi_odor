id: sweep
name: sweep
description: ''
version: 1.0.0
hardware:
  bottle_capacity_ml: 150
  max_fill_ml: 100
  liquids:
    - id: '31'
      name: 95%乙醇
      type: LIQUID_SAMPLE
    - id: '6'
      name: 蒸馏水
      type: LIQUID_SAMPLE
    - id: '37'
      name: 纯净水
      type: LIQUID_RINSE
steps:
  - name: 配置加热器
    configure_heater:

            - 3
            - 5
            - 6
            - 7
  - name: 传感器预热
    phase_name: PREHEAT
    preheat:
      max_duration_s: 120
      record_data: false
      gas_pump_pwm: 50
      duration_s: 60
  - name: '[参数扫描 #1/5] [参数扫描 #1/6] 进样 (5%:95%) (10ml)'
    phase_name: INJECT
    inject:
      components:
        - liquid_id: '31'
          ratio: 5
        - liquid_id: '6'
          ratio: 95
      tolerance: 0.5
      flow_rate_ml_s: 3
      stable_timeout_s: 5
      target_volume_ml: 10
  - name: '[参数扫描 #1/5] [参数扫描 #1/6] 数据采集'
    phase_name: ACQUIRE
    acquire:
      gas_pump_pwm: 80
      duration_s: 60
  - name: '[参数扫描 #1/5] [参数扫描 #1/6] 清洗'
    phase_name: WASH
    wash:
      wash_liquid_id: '37'
      wash_volume_ml: 100
      repeat_count: 2
      gas_pump_pwm: 50
      fill_timeout_s: 60
      drain_timeout_s: 60
      empty_tolerance_g: 10

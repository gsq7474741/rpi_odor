id: new_experiment
name: 新实验
description: ''
version: 1.0.0
hardware:
  bottle_capacity_ml: 150
  max_fill_ml: 100
  liquids:
    - id: '31'
      name: 95%乙醇
      pump_index: 0
      type: LIQUID_SAMPLE
    - id: '6'
      name: 蒸馏水
      pump_index: 0
      type: LIQUID_SAMPLE
steps:
  - name: 配置加热器
    configure_heater:
      configs: []
  - name: 传感器预热
    preheat:
      max_duration_s: 120
      record_data: false
      gas_pump_pwm: 50
      duration_s: 60
  - name: '[参数扫描 #1/5] [参数扫描 #1/6] 进样 (95%:5%)'
    inject:
      components:
        - liquid_id: '31'
          ratio: 5
        - liquid_id: '6'
          ratio: 95
      target_volume_ml: 10
      tolerance: 0.5
      flow_rate_ml_s: 3
      stable_timeout_s: 5
  - name: '[参数扫描 #1/5] [参数扫描 #1/6] 数据采集'
    acquire:
      gas_pump_pwm: 80
      duration_s: 60
  - name: '[参数扫描 #1/5] [参数扫描 #1/6] 清洗'
    wash:
      wash_liquid_id: distilled_water
      wash_volume_ml: 100
      repeat_count: 2
      gas_pump_pwm: 50
      drain_after: true
  - name: '[参数扫描 #1/5] [参数扫描 #2/6] 进样 (90%:10%)'

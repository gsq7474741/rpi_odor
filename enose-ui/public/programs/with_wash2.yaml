id: with_wash
name: 带清洗流程
description: 包含清洗步骤的实验流程
version: 1.0.0
hardware:
  bottle_capacity_ml: 150
  max_fill_ml: 100
  liquids:
    - id: '4'
      name: 橙汁
      pump_index: 0
      type: LIQUID_SAMPLE
    - id: '3'
      name: 苹果汁
      pump_index: 0
      type: LIQUID_SAMPLE
steps:
  - name: 进样
    inject:
      components:
        - liquid_id: '4'
          ratio: 1
      tolerance: 0.5
      flow_rate_ml_min: 5
      target_volume_ml: 20
  - name: 等待
    wait:
      duration_s: 59
      timeout_s: 120
  - name: 数据采集
    acquire:
      gas_pump_pwm: 50
      stability:
        window_s: 30
        threshold_percent: 5
      max_duration_s: 300
  - name: 排废
    drain:
      gas_pump_pwm: 80
      timeout_s: 60
  - name: 清洗
    wash:
      wash_liquid_id: '3'
      wash_volume_ml: 20
      repeat_count: 2
      gas_pump_pwm: 50
      drain_after: true
_editor_layout:
  nodes:
    - id: start
      type: start
      position:
        x: 50
        'y': 45
      data:
        programId: with_wash
        programName: 带清洗流程
        description: 包含清洗步骤的实验流程
        version: 1.0.0
    - id: liquid_sample
      type: liquidSource
      position:
        x: -150
        'y': 191
      data:
        liquidId: 4
        liquidName: 橙汁
        ratio: 1
    - id: liquid_wash
      type: liquidSource
      position:
        x: -150
        'y': 820
      data:
        liquidId: 3
        liquidName: 苹果汁
        ratio: 1
    - id: inject_1
      type: inject
      position:
        x: 50
        'y': 180
      data:
        name: 进样
        targetType: volume
        targetVolumeMl: 20
    - id: wait_1
      type: waitTime
      position:
        x: 50
        'y': 344
      data:
        name: 等待
        durationS: 59
    - id: acquire_1
      type: acquire
      position:
        x: 50
        'y': 486
      data:
        name: 数据采集
        terminationType: stability
    - id: drain_1
      type: drain
      position:
        x: 50
        'y': 648
      data:
        name: 排废
    - id: wash_1
      type: wash
      position:
        x: 50
        'y': 810
      data:
        name: 清洗
        washLiquidId: distilled_water
    - id: end
      type: end
      position:
        x: 50
        'y': 972
      data: {}
  edges:
    - id: e1
      source: start
      target: inject_1
      sourceHandle: flow
      targetHandle: flow
    - id: e_liq1
      source: liquid_sample
      target: inject_1
      sourceHandle: liquid
      targetHandle: liquid
    - id: e2
      source: inject_1
      target: wait_1
      sourceHandle: flow
      targetHandle: flow
    - id: e3
      source: wait_1
      target: acquire_1
      sourceHandle: flow
      targetHandle: flow
    - id: e4
      source: acquire_1
      target: drain_1
      sourceHandle: flow
      targetHandle: flow
    - id: e5
      source: drain_1
      target: wash_1
      sourceHandle: flow
      targetHandle: flow
    - id: e_liq2
      source: liquid_wash
      target: wash_1
      sourceHandle: liquid
      targetHandle: liquid
    - id: e6
      source: wash_1
      target: end
      sourceHandle: flow
      targetHandle: flow

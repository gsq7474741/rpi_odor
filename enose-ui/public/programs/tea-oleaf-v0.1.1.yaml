  - name: 传感器预热
    phase_name: PREHEAT
    preheat:
      max_duration_s: 300
      record_data: true
      gas_pump_pwm: 50
      stability:
        window_s: 30
        threshold_percent: 8
  - name: '[循环 #1/5] [参数扫描 #1/5] 进样 (100%:0%:0%:0%:0%)'
    phase_name: INJECT
    inject:

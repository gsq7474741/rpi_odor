id: tea-oleaf-v0.1.3-mix
name: tea-oleaf-v0.1.3-mix
description: ''
version: 1.0.0
hardware:
  bottle_capacity_ml: 150
  max_fill_ml: 100
  liquids:
    - id: '56'
      name: 东方树叶-乌龙茶
      type: LIQUID_SAMPLE
    - id: '68'
      name: 东方树叶-红茶
      type: LIQUID_SAMPLE
    - id: '55'
      name: 东方树叶-茉莉花茶
      type: LIQUID_SAMPLE
    - id: '57'
      name: 东方树叶-青柑普洱
      type: LIQUID_SAMPLE
    - id: '69'
      name: 东方树叶-黑乌龙
      type: LIQUID_SAMPLE
    - id: '37'
      name: 纯净水
      type: LIQUID_RINSE
steps:
  - name: 配置加热器
    configure_heater:

  - name: 传感器预热
    phase_name: PREHEAT
    preheat:
      max_duration_s: 300
      record_data: true
      gas_pump_pwm: 50
      stability:
        window_s: 30
        threshold_percent: 8
  - name: '[循环 #1/2] [参数扫描 #1/5] 进样 (0%:0%:0%:0%:100%)'
    phase_name: INJECT
    inject:
      components:
        - liquid_id: '56'
          ratio: 0
        - liquid_id: '69'
          ratio: 0
        - liquid_id: '55'
          ratio: 0
        - liquid_id: '57'
          ratio: 0
        - liquid_id: '68'
          ratio: 1
      tolerance: 5
      flow_rate_ml_s: 3
      stable_timeout_s: 10
      target_volume_ml: 40
  - name: '[循环 #1/2] [参数扫描 #1/5] 数据采集'
    phase_name: ACQUIRE
    acquire:
      gas_pump_pwm: 50
      duration_s: 120
  - name: '[循环 #1/2] [参数扫描 #1/5] 清洗'
    phase_name: WASH
    wash:

      record_data: true
      gas_pump_pwm: 50
      stability:
        window_s: 30
        threshold_percent: 8
  - name: '[循环 #1/1] [参数扫描 #1/60] 进样 (0%:0%:0%:0%:100%)'
    phase_name: INJECT
    inject:

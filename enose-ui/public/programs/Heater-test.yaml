        description: ''
        version: 1.0.0
    - id: end
      type: end
      position:
        x: 565
        'y': 615
      data: {}
    - id: node_1
      type: configureHeater
      position:
        x: 565
        'y': 135
      data:
        sensorProfiles:
          '2': pulse_fast
          '8': ''
          '9': low_power
          '10': constant_320__2
          '11': temp_scan_100_350__3
    - id: node_2
      type: acquire
      position:
        x: 565
        'y': 453
      data:
        name: 数据采集
        gasPumpPwm: 50
        terminationType: cycles
        heaterCycles: 10
        maxDurationS: 300
    - id: node_3
      type: preheat
      position:
        x: 565
        'y': 294
      data: {}

services:
  # TimescaleDB - 时序数据库
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: enose-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: enose
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enose_secure_password}
      POSTGRES_DB: enose
      # TimescaleDB 调优参数 (适配树莓派 4GB 内存)
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro  # 纯迁移方案：通过 migrate_db.ps1 执行
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enose -d enose"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 资源限制 (树莓派)
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Redis - 实时数据缓存和消息队列
  redis:
    image: redis:7-alpine
    container_name: enose-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 128M

  # RedisInsight - Redis 官方 Web UI (支持 ARM64)
  redisinsight:
    image: redis/redisinsight:latest
    container_name: enose-redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis
    profiles:
      - dev
    deploy:
      resources:
        limits:
          memory: 256M
  
  # pgAdmin - PostgreSQL Web UI (可选，开发调试用)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: enose-pgadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - timescaledb
    profiles:
      - dev
    deploy:
      resources:
        limits:
          memory: 256M

  # MinIO - 对象存储服务 (兼容 S3 API)
  minio:
    image: minio/minio:latest
    container_name: enose-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # MinIO Client - 用于初始化 bucket (一次性任务)
  minio-init:
    image: minio/mc:latest
    container_name: enose-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set enose http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb --ignore-existing enose/attachments;
      mc mb --ignore-existing enose/models;
      mc mb --ignore-existing enose/datasets;
      mc anonymous set download enose/attachments;
      echo 'MinIO buckets initialized successfully';
      exit 0;
      "
    profiles:
      - init

  # enose-analytics - Python 质检与分析服务
  enose-analytics:
    build:
      context: ../enose-analytics
      dockerfile: Dockerfile
    container_name: enose-analytics
    restart: unless-stopped
    ports:
      - "50052:50052"
    environment:
      # 数据库配置
      DATABASE_HOST: timescaledb
      DATABASE_PORT: 5432
      DATABASE_NAME: enose
      DATABASE_USER: enose
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-enose_secure_password}
      # MinIO 配置
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      # enose-control 连接
      CONTROL_SERVICE_HOST: host.docker.internal
      CONTROL_SERVICE_PORT: 50051
    volumes:
      - ../enose-analytics/config:/app/config:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    profiles:
      - analytics

volumes:
  timescaledb_data:
    driver: local
  redis_data:
    driver: local
  redisinsight_data:
    driver: local
  pgadmin_data:
    driver: local
  minio_data:
    driver: local

networks:
  default:
    name: enose-network
